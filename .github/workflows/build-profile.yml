name: build-profile

# Regenerates the animated SVGs + README, and refreshes the live stats card.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (08:47 IST)
  workflow_dispatch: {} # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - profile.config.json
      - README.template.md
      - scripts/**

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build banner, terminal, footer and README
        run: node scripts/build.mjs

      - name: Fetch live GitHub stats
        run: node scripts/stats.mjs
        env:
          # Default token: public repos + followers. For the "contributions (1y)" line,
          # add a classic PAT (read:user) as a repo secret named STATS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
